name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # There is no .env in CI, and Settings has no default for the lake on purpose.
    env:
      LAKE_URI: data/lake
    # The alert tests skip when nothing answers on the DSN. A service here makes them run.
    # Same user, password and port as the default DSN in finplat/settings.py.
    services:
      postgres:
        # The same image as both compose files, so the vector extension exists in tests too.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: finplat
          POSTGRES_PASSWORD: finplat
          POSTGRES_DB: finplat
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U finplat"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

  alert-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The same Prometheus version as both compose files. promtool checks the syntax, then
      # feeds each rule a made-up series and asserts when it fires and when it does not.
      - name: Check and test the alert rules
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/p" -w /p --entrypoint promtool             prom/prometheus:v3.15.0 check rules rules.yml
          docker run --rm -v "$PWD/deploy/prometheus:/p" -w /p --entrypoint promtool             prom/prometheus:v3.15.0 test rules rules_test.yml

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.5

      - name: Format
        run: terraform -chdir=terraform fmt -check -recursive

      # No AWS credentials. validate checks the configuration itself, which is all that can be
      # checked without an account, and it catches a typed resource name before an apply does.
      - name: Validate
        # validate hashes the Lambda zip, which is build output and not in git. An empty file
        # stands in for it. Nothing is applied, so the hash is never used.
        run: |
          mkdir -p build && touch build/scorer.zip
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

  # The server pulls this image. It is built only after both checks pass on main, so a red
  # commit never reaches the registry.
  image:
    needs: [test, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The commit SHA is the tag a deploy pins. latest is for a first pull by hand. Both images
      # carry the same SHA, so one IMAGE_TAG on the server names a matching pair.
      # Each image has its own cache scope. A shared scope lets one build evict the other.
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/syakeerrahman/regulated-finance-data-platform-api:${{ github.sha }}
            ghcr.io/syakeerrahman/regulated-finance-data-platform-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Airflow image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/syakeerrahman/regulated-finance-data-platform-airflow:${{ github.sha }}
            ghcr.io/syakeerrahman/regulated-finance-data-platform-airflow:latest
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,mode=max,scope=airflow
