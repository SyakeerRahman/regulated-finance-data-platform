services:
  airflow:
    build: .
    command: standalone
    # Docker Desktop starts these again after a reboot, once it is running itself.
    restart: unless-stopped
    ports:
      # 127.0.0.1 on every port: every visitor is an Airflow admin and the Postgres password is
      # in this file, so nothing here may answer to another machine on the network.
      - "127.0.0.1:8095:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Local only: every visitor is an admin, so there is no generated password to look up.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      LAKE_URI: /opt/lake
      PYTHONPATH: /opt/project
      # Inside the network the server is a service name. localhost is the container itself.
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      # Airflow's own SQLite database lives here. Inside the container, a rebuild deleted it on
      # 2026-10-03: every run was forgotten and every DAG came back paused.
      - airflow-state:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./finplat:/opt/project/finplat
      - ./data/lake:/opt/lake
      # The model files. A training run here writes where the API reads.
      - ./data/mlflow:/mlflow

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    # Named, so an MCP client can start `docker exec -i finplat-api python -m finplat.mcp_server`.
    container_name: finplat-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8097:8000"
    # The LLM key and its settings. The values below replace the ones in .env that only make
    # sense outside a container.
    env_file: .env
    environment:
      LAKE_URI: /opt/lake
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AIRFLOW_URL: http://airflow:8080
      POSTGRES_DSN: postgresql://finplat:finplat@postgres:5432/finplat
    volumes:
      - ./data/lake:/opt/lake
      # The model registry stores plain paths such as /mlflow/artifacts/1/... and the API loads
      # the files from there. This is the same folder the mlflow service mounts.
      - ./data/mlflow:/mlflow
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.6.0
    restart: unless-stopped
    # MLflow 3 answers 403 to a Host header it does not know, and the default list does not
    # include the service name that Airflow uses. See deploy/compose.yml for the workers note.
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --workers 1
      --allowed-hosts mlflow:5000,localhost:8096,127.0.0.1:8096,host.docker.internal:8096
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "127.0.0.1:8096:5000"
    volumes:
      - ./data/mlflow:/mlflow

  postgres:
    # pgvector for the case search. The Debian image, so a volume made by the old Alpine image is
    # never mounted here: the two sort text differently, and its text indexes would be wrong.
    # The data moved with pg_dump and a restore, which rebuilds every index.
    image: pgvector/pgvector:pg18
    # Named, so `docker ps` on a machine running several projects says which one holds 5440.
    container_name: finplat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finplat
      POSTGRES_PASSWORD: finplat
      POSTGRES_DB: finplat
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      # Postgres 18 wants the mount one level up. A mount at /data leaves the real data
      # directory outside the volume and the container refuses to start.
      - finplat-pgvector:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finplat"]
      interval: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # About 2 MB a day at finplat's size. 15 days is enough to see a drift start.
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:8099:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus:/prometheus
    depends_on:
      - api
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:8100:9093"
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager:/alertmanager

  # Grafana runs on this PC only. Its image is about 1.5 GB unpacked, and the server's 8 GB
  # disk budget cannot hold it. The dashboard is a file in deploy/grafana/, so it is the same
  # wherever Grafana runs. The alert rules are in Prometheus, so the server alerts without it.
  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    environment:
      # Local only, like Airflow: every visitor is an admin, so there is no password to look up.
      # The port binds to 127.0.0.1. deploy/compose.yml asks for a password instead.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:8098:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  finplat-pgvector:
  airflow-state:
  prometheus:
  alertmanager:
  grafana:
