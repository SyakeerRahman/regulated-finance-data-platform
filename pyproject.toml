[project]
name = "regulated-finance-data-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "deltalake==1.6.3",
    "fastapi==0.141.1",
    "mlflow==3.16.1",
    "numpy==2.5.3",
    "pandas==3.0.5",
    "psycopg[binary]==3.3.6",
    "pyarrow==25.0.1",
    "pydantic-settings==2.15.0",
    "scikit-learn==1.9.1",
    "shap==0.52.0",
    "uvicorn==0.53.0",
    "xgboost==3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finplat"]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.ruff]
line-length = 120
