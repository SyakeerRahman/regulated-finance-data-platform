# The production stack on the shared VPS. Run from this folder:
#
#     docker compose --env-file .env up -d
#
# The server holds other projects, so every container has a memory limit, and nothing listens on
# a public port. The dashboard and MLflow bind to 127.0.0.1. The Cloudflare tunnel reaches the
# dashboard. MLflow and Airflow are for an SSH tunnel only.

name: finplat

services:
  airflow:
    image: ghcr.io/syakeerrahman/regulated-finance-data-platform-airflow:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # standalone runs the scheduler, the API server, the DAG processor and the triggerer in one
    # container, on SQLite. Two DAGs, one daily and one weekly, do not need a worker pool.
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Every visitor is an admin. Safe only because the port binds to 127.0.0.1 and is reached
      # over SSH. Never route this port through the Cloudflare tunnel.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/state/airflow.db
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/state/logs
      # The DAG processor writes one file per DAG per day, outside the base folder by default.
      # Inside it, the daily logs task deletes these after 14 days too.
      AIRFLOW__LOGGING__DAG_PROCESSOR_CHILD_PROCESS_LOG_DIRECTORY: /opt/airflow/state/logs/dag_processor
      LAKE_URI: /lake
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "127.0.0.1:8095:8080"
    volumes:
      - lake:/lake
      - airflow:/opt/airflow/state
    depends_on:
      mlflow:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 2g

  api:
    image: ghcr.io/syakeerrahman/regulated-finance-data-platform-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      LAKE_URI: /lake
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AIRFLOW_URL: http://airflow:8080
      POSTGRES_DSN: postgresql://finplat:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/finplat
      # Optional. With no key the AI layer reports itself off and every alert keeps its SHAP
      # reason and its policy rule.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_DAILY_CALLS: ${LLM_DAILY_CALLS:-500}
      # The case search. Empty base URL and key mean the chat model's.
      EMBED_BASE_URL: ${EMBED_BASE_URL:-}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:-openai/text-embedding-3-small}
      EMBED_DIM: ${EMBED_DIM:-1536}
    ports:
      - "127.0.0.1:8097:8000"
    volumes:
      - lake:/lake
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    deploy:
      resources:
        limits:
          # Measured on 2026-09-27: 350 MiB idle, 375 MiB during a 50/sec burst. Warm-up reads
          # account_id and amount from all of silver, and at 90 days that is about 7.8 million
          # rows. Measure again when silver reaches its retention limit.
          memory: 1536m

  postgres:
    # pgvector for the case search. See the note in ../docker-compose.yml on why the volume is new.
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: finplat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: finplat
    volumes:
      # Postgres 18 wants the mount one level up. See the note in ../docker-compose.yml.
      - pgvector:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finplat"]
      interval: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.6.0
    restart: unless-stopped
    # --serve-artifacts makes every client read and write model files over HTTP. The local stack
    # stores a plain path instead, so on Windows training wrote the models to C:\mlflow on the
    # host and no container could read them.
    # --allowed-hosts: MLflow 3 answers 403 to any Host header it does not know. The default
    # allows localhost and private IPs, not the service name the other containers use.
    # --workers 1: the default of 4 is most of the idle memory, and two clients need one.
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --workers 1
      --allowed-hosts mlflow:5000,localhost:8096,127.0.0.1:8096
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts --artifacts-destination /mlflow/artifacts
    ports:
      - "127.0.0.1:8096:5000"
    volumes:
      - mlflow:/mlflow
    deploy:
      resources:
        limits:
          # Idle use with 1 worker measured at 312 MiB on 2026-09-27. With 4 it was 735 MiB.
          memory: 512m

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    # For an SSH tunnel only, like MLflow.
    ports:
      - "127.0.0.1:8099:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus:/prometheus
    depends_on:
      - api
      - alertmanager
    deploy:
      resources:
        limits:
          # Measured on 2026-10-05: 124 MiB with one target.
          memory: 256m

  alertmanager:
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    # For an SSH tunnel only, like MLflow.
    ports:
      - "127.0.0.1:8100:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager:/alertmanager
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  airflow:
  lake:
  pgvector:
  mlflow:
  prometheus:
  alertmanager:
